# 自动发版流水线: push v* tag → CI 构建完整分发包 → 创建 Release
#
# 设计原则 (详见 CLAUDE.md "Release" 节):
#   - 代码内容由 tag 锁定: tag 事件下 checkout 的是 tag 指向的 commit,
#     master 上尚未测试的改动在机制上不可能混入发版产物
#   - data 来自常驻 data prerelease 的附件; data 上传本身不触发任何 workflow
#   - tag 含 -rc/-beta/-test 后缀 → --prerelease 灰度渠道:
#     GitHub /releases/latest 永不返回 prerelease, 用户端 checkUpdate() 不受影响
#   - workflow_dispatch + dry_run=true: 只构建不发布, 产物挂 artifact 供核验
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (tag 事件自动从 tag 提取; 手动触发必填, 如 1.590)'
        required: false
        default: ''
      dry_run:
        description: 'dry-run: 不创建 Release, 仅产出 artifact 核验'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag 指向的 commit — 代码内容由此锁定)
        uses: actions/checkout@v4

      - name: Setup JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 提取版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"   # 如 v1.590 / v1.590-rc1
          else
            TAG="v${INPUT_VERSION:?手动触发 (workflow_dispatch) 必须填写 version}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # -rc/-beta/-test 后缀 → prerelease 灰度
          if echo "$VERSION" | grep -Eq -- '-(rc|beta|test)'; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "发布: $TAG (prerelease=$( [ "${{ github.event_name }}" = push ] && echo auto || echo manual-input ))"

      - name: 下载 launch4j 3.50 (Linux 发行包)
        run: |
          mkdir -p build/launch4j
          curl -sSL --retry 3 -o build/launch4j.tgz \
            "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-linux-x64.tgz/download"
          # 包内顶层为 launch4j/ (launch4j.jar + bin/windres 同级), 剥一层;
          # 自带 launch4jc 是 CRLF shell 脚本 Linux 无法执行 → build.sh 走 jar 模式
          tar -xzf build/launch4j.tgz -C build/launch4j --strip-components=1
          test -f build/launch4j/launch4j.jar

      - name: 下载 data 存储 (常驻 data prerelease 附件)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/fmdata
          if ! gh release download data --pattern "*.zip" --dir build/fmdata --clobber; then
            echo "::error::data Release 不存在或无附件, 无法组包。请先在本地执行:"
            echo "::error::  WT_GAME_DIR=<游戏目录> bash script/build.sh fmdata"
            echo "::error::  gh release create data dist/VoidMei_data_*.zip dist/data_manifest.json --prerelease"
            exit 1
          fi
          ls -lh build/fmdata/
          echo "VOIDMEI_FMDATA_ZIP=$(ls "$(pwd)"/build/fmdata/*.zip | head -1)" >> "$GITHUB_ENV"

      - name: 同步 更新日志.txt (使 zip 内外一致)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash script/release_notes.sh append-txt "$VERSION"
          # 备份供最后回写 master 步骤使用 (checkout master 会丢弃工作区改动)
          cp 更新日志.txt build/更新日志.for-master.txt

      - name: 组装完整分发包
        env:
          VOIDMEI_VERSION: ${{ steps.ver.outputs.version }}
          VOIDMEI_FMDATA_ZIP: ${{ env.VOIDMEI_FMDATA_ZIP }}
          VOIDMEI_LAUNCH4J: build/launch4j/launch4j.jar
        run: |
          bash script/build.sh dist
          ls -lh dist/

      - name: 生成 Release notes (CHANGELOG.md 该版本段落)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash script/release_notes.sh extract-md "$VERSION" > build/release_body.md

      - name: dry-run 核验 (不发布)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: VoidMei-${{ steps.ver.outputs.version }}-dryrun
          path: |
            dist/*.zip
            dist/*.sha256
            build/release_body.md
          retention-days: 7

      - name: 创建 Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          ARGS=(--title "VoidMei v$VERSION" --notes-file build/release_body.md)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 "${ARGS[@]}"

      - name: 回写 更新日志.txt 到 master (失败不阻塞发版)
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          cp build/更新日志.for-master.txt 更新日志.txt
          if git diff --quiet; then
            echo "更新日志.txt 无变化, 跳过回写"
          else
            git add 更新日志.txt
            git commit -m "docs(changelog): v$VERSION"
            git push origin master || echo "::warning::push master 失败, 请手动同步 更新日志.txt"
          fi
